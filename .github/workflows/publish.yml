# .github/workflows/publish.yml
name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tags

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Add UV to the environment
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Generate lock file
        run: uv lock

      - name: Build package
        run: uv build

      - name: Publish package
        env:
          PYPI_USERNAME: __token__
          PYPI_PASSWORD: ${{ secrets.MQSS_PYPI_API_TOKEN }}
        # TODO: switch to PyPI trusted publishing (needs a PyPI-side publisher entry)
        run: uv publish -v -u ${PYPI_USERNAME} -p ${PYPI_PASSWORD} # zizmor: ignore[use-trusted-publishing]
