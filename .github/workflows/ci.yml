name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🐍 Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # Formatting and the remaining hooks run through pre-commit.ci (see .pre-commit-config.yaml).
      - name: Run ruff
        run: uv run --group dev ruff check .

  python-tests-ubuntu:
    name: 🐍 Test 🐧
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests"]'
      draft-sessions: '["tests-3.12"]'
      use-sccache-gha: false

  python-tests-macos:
    name: 🐍 Test 🍎
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: macos-26
      sessions: '["tests-3.13"]'
      draft-sessions: '["tests-3.13"]'
      use-sccache-gha: false

  python-coverage:
    name: 🐍 Coverage
    needs:
      - python-tests-ubuntu
      - python-tests-macos
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    permissions:
      contents: read
      id-token: write

  docs:
    name: 📝 Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Build documentation
        run: uv run --group dev mkdocs build

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - lint
      - python-tests-ubuntu
      - python-tests-macos
      - python-coverage
      - docs
    runs-on: ubuntu-26.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
